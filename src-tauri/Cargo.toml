[package]
name = "duck-s3"
version = "0.1.0"
description = "A native S3-compatible storage browser."
authors = ["Duck S3 Contributors"]
edition = "2021"

[lib]
name = "duck_s3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
